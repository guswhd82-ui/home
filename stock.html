<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>지금 살 수 있는 벤츠 · 차종·색 — 유현종 차장</title>
<meta name="description" content="지금 살 수 있는 메르세데스-벤츠 차종·외장색·내장. 기준 시각 표시 · 실제 배정은 유현종 차장 상담으로.">
<meta property="og:title" content="지금 살 수 있는 벤츠 · 차종·색">
<meta property="og:description" content="차종을 고르면 지금 재고 있는 색 조합 — 유현종 차장 개인 상담 페이지">
<link rel="stylesheet" href="site.css?v=1031b">
</head>
<body class="sub" ontouchstart=""><div class="app">
<main class="wrap">
  <!-- 재고 : stock.json (평일 자동 · 제작방 재고공개_만들기.py) · ★대수·합계는 화면에 쓰지 않음 -->
  <section id="stock">
    <div class="kicker">Available now</div>
    <h2>지금 살 수 있는 차 · 색</h2>
    <p class="sub" id="stockAsof">불러오는 중…</p>
    <div id="stockStale" class="stale" hidden></div>
    <input id="q" class="search" type="search" placeholder="차종 · 색 · 내장 검색 (예: E 200, 화이트)" aria-label="재고 검색">
    <div id="stockChips" class="chips scroll" role="group" aria-label="차종 선택"></div>
    <div id="stockList"></div>
    <p class="note">기준 시각 시점에 보유한 차종·색 조합이며 실시간이 아닙니다. 실제 배정 가능 여부와 이달 조건은 상담으로 확인해 드립니다.</p>
    <a class="ask" data-track="sms" id="askBtn" href="#">원하는 차종 · 색으로 문자 남기기 →</a>
  </section>
</main>
<div id="bottom"></div>
</div>
<script src="site.js?v=1031c"></script>
<script>
(function () {
  var S = window.SITE, $ = S.$; S.chrome('stock.html');
  var st = { d: null, fam: S.param('car'), text: S.param('model') };
  $('q').value = st.text;
  function ask() { $('askBtn').href = S.sms('상담 신청: ' + (st.text || st.fam || '관심 차종') + ' · 원하는 색 · 희망 시기를 남겨 주세요.'); }
  function render() {
    var list = $('stockList'); list.textContent = '';
    var models = S.stockModels(st.d, st.fam, st.text);
    if (!models.length) { list.appendChild(S.el('div', 'empty', '조건에 맞는 차가 없습니다 — 다른 색·차종으로 보거나 문의해 주세요.')); ask(); return; }
    models.forEach(function (m) { list.appendChild(S.modelCard(m, models.length === 1)); });
    ask();
  }
  function chips() {
    var fams = S.fams(st.d), items = [['', '전체']].concat(Object.keys(fams).sort().map(function (k) { return [k, k]; }));
    if (st.fam && !fams[st.fam]) st.fam = '';
    S.chipBar($('stockChips'), items, function () { return st.fam; }, function (v) { st.fam = v; }, render, false);
  }
  S.getJSON('stock.json').then(function (d) {
    st.d = d; $('stockAsof').textContent = '기준 ' + d.기준시각 + ' · 차종을 고르면 지금 재고 있는 색 조합';
    if (d.모의) $('stockAsof').appendChild(S.el('span', 'mock', '모의 데이터'));
    var s = S.stale(d.기준시각); if (s) { $('stockStale').hidden = false; $('stockStale').textContent = s; }
    chips(); render();
  }).catch(function () { $('stockAsof').textContent = '준비 중'; $('q').hidden = true; $('stockList').appendChild(S.el('div', 'empty', '재고 공개를 준비 중입니다. 지금 살 수 있는 차·색은 카톡·문자로 바로 확인해 드립니다.')); ask(); });
  $('q').addEventListener('input', function (e) { st.text = e.target.value; if (st.d) render(); });
})();
</script>
</body>
</html>
