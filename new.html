<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>벤츠 신차 · 사전예약 소식 — 유현종 차장</title>
<meta name="description" content="메르세데스-벤츠 신차 출시 · 사전계약 · 사전예약 소식과 상담 안내 — 유현종 차장 개인 상담 페이지.">
<link rel="stylesheet" href="site.css">
</head>
<body><div class="app">
<main class="wrap">
  <!-- 신차·사전예약 : posts.json 소식(자동) · 출시 때 1장은 이 틀로 추가(손 1번) -->
  <section id="new">
    <div class="kicker">New &amp; Upcoming</div>
    <h2>신차 · 사전예약</h2>
    <p class="sub">신차 출시 · 사전계약 소식 — 내용은 블로그에서 이어집니다.</p>
    <div id="newsList"></div>
    <div class="card" id="noNews" hidden><h3>준비 중</h3><p class="sub" style="margin:0">새 소식이 올라오면 여기에 자동으로 나타납니다. 궁금한 신차는 상담으로 먼저 알려 드립니다.</p></div>
    <div class="big" style="margin-top:14px">
      <a class="p" data-track="kakao" href="https://open.kakao.com/o/szY84nJi" target="_blank" rel="noopener">사전계약 · 출시 알림 상담</a>
      <a data-track="sms" id="smsBtn" href="#">문자로 알림 신청</a>
    </div>
  </section>
</main>
<div id="bottom"></div>
</div>
<script src="site.js"></script>
<script>
(function () {
  var S = window.SITE, $ = S.$; S.chrome('new.html');
  $('smsBtn').href = S.sms('출시 알림 신청: 관심 신차 이름과 연락 가능한 시간을 남겨 주세요.');
  S.getJSON('posts.json').then(function (d) { var n = S.news(d, 12); if (!n.length) { $('noNews').hidden = false; return; } n.forEach(function (p) { $('newsList').appendChild(S.postCard(p)); }); }).catch(function () { $('noNews').hidden = false; });
})();
</script>
</body>
</html>
