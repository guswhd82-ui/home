<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>제휴(MOU) 확인 — 유현종 차장</title>
<meta name="description" content="우리 회사가 벤츠 제휴 기업인지 회사명으로 확인 — 유현종 차장 개인 상담 페이지.">
<link rel="stylesheet" href="site.css?v=1031a">
</head>
<body class="sub"><div class="app">
<main class="wrap">
  <!-- 제휴 확인 : mou.json {기준, 목록:[회사명…]} 이 있으면 검색(PC가 하루 1번 뽑아 올림) · 없으면 상담 안내 -->
  <section id="mou">
    <div class="kicker">Partnership</div>
    <h2>제휴 확인</h2>
    <p class="sub" id="mSub">재직 중인 회사가 제휴 기업인지 회사명으로 확인하세요.</p>
    <input id="q" class="search" type="search" placeholder="회사명 검색" aria-label="회사명 검색">
    <div id="mList"></div>
    <p class="note">제휴 여부는 사업자번호 기준으로 최종 확인합니다. 목록에 없어도 계열사·관계사는 해당될 수 있으니 문의해 주세요.</p>
    <a class="ask" data-track="kakao" href="https://open.kakao.com/o/szY84nJi" target="_blank" rel="noopener">제휴 여부 상담 →</a>
  </section>
</main>
<div id="bottom"></div>
</div>
<script src="site.js?v=1031a"></script>
<script>
(function () {
  var S = window.SITE, $ = S.$; S.chrome('mou.html');
  var list = null;
  function render() {
    var box = $('mList'); box.textContent = ''; var q = S.norm($('q').value);
    if (!list) { box.appendChild(S.el('div', 'empty', '제휴 목록을 준비 중입니다 — 회사명을 남겨 주시면 확인해 드립니다.')); return; }
    if (!q) { box.appendChild(S.el('div', 'empty', '전체 ' + list.length + '곳 · 회사명을 입력하세요')); return; }
    var hit = list.filter(function (n) { return S.norm(n).indexOf(q) >= 0; }).slice(0, 30);
    if (!hit.length) { box.appendChild(S.el('div', 'empty', '검색 결과가 없습니다 — 계열사·관계사는 상담으로 확인해 드립니다.')); return; }
    hit.forEach(function (n) { var r = S.el('div', 'row'); r.appendChild(S.el('div', 'c', n)); r.appendChild(S.el('div', 'n', '제휴')); box.appendChild(r); });
  }
  S.getJSON('mou.json').then(function (d) { list = d.목록 || []; if (d.기준) $('mSub').textContent = '기준 ' + d.기준 + ' · 전체 ' + list.length + '곳'; render(); }).catch(function () { $('q').disabled = true; render(); });
  $('q').addEventListener('input', render);
})();
</script>
</body>
</html>
