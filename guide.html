<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>차종 가이드 · 가격 · 이달 조건 · 지금 있는 색 — 유현종 차장</title>
<meta name="description" content="벤츠 차종 하나의 가격·이달 조건·지금 살 수 있는 색·블로그 글·영상을 한 곳에 — 유현종 차장 개인 상담 페이지.">
<link rel="stylesheet" href="site.css">
</head>
<body><div class="app">
<main class="wrap">
  <!-- 차종 가이드 1장 : ?car=계열 · prices + promo + stock + posts + videos 조합(전부 자동) · 제원·옵션 표는 2차(카탈로그 추출) -->
  <section id="guide">
    <div class="kicker" id="gk">Model guide</div>
    <h2 id="gTitle">차종</h2>
    <p class="sub" id="gSub">가격 · 이달 조건 · 지금 있는 색 · 글 · 영상</p>
    <div id="famChips" class="chips scroll"></div>
    <div id="body"></div>
  </section>
</main>
<div id="bottom"></div>
</div>
<script src="site.js"></script>
<script>
(function () {
  var S = window.SITE, $ = S.$, el = S.el; S.chrome('models.html');
  var D = { prices: null, promo: null, stock: null, posts: null, videos: null }, fam = S.param('car');
  function card(title, sub) { var c = el('div', 'card'); c.appendChild(el('h3', '', title)); if (sub) c.appendChild(el('p', 'sub', sub)); return c; }
  function render() {
    var body = $('body'); body.textContent = ''; if (!fam) return;
    $('gTitle').textContent = fam; document.title = fam + ' 가격 · 이달 조건 · 지금 있는 색 — 유현종 차장';
    try { history.replaceState(null, '', 'guide.html?car=' + encodeURIComponent(fam)); } catch (e) {}
    // ① 가격 · 이달 조건
    var pr = D.prices ? D.prices.목록.filter(function (r) { return r.계열 === fam; }) : [];
    var c1 = card('가격 · 이달 조건', D.prices ? '가격표 ' + D.prices.기준 + (S.promoOK(D.promo) ? ' · 이달 조건 반영' : '') : '');
    if (D.promo && D.promo.모의) c1.firstChild.appendChild(el('span', 'mock', '조건은 모의'));
    if (pr.length) {
      var ys = {}; pr.forEach(function (r) { ys[r.연식] = 1; }); var box = el('div', 'plist');
      Object.keys(ys).sort().reverse().forEach(function (my) { box.appendChild(el('h3', '', '20' + my.slice(2) + '년식')); pr.filter(function (r) { return r.연식 === my; }).forEach(function (r) { box.appendChild(S.priceRow(r, D.promo)); }); });
      c1.appendChild(box);
    } else c1.appendChild(el('div', 'empty', '가격표에 없는 차종입니다 — 상담으로 안내해 드립니다.'));
    body.appendChild(c1);
    // ② 지금 있는 색(대수 없음)
    var c2 = card('지금 살 수 있는 색', D.stock ? '기준 ' + D.stock.기준시각 : '');
    if (D.stock && D.stock.모의) c2.firstChild.appendChild(el('span', 'mock', '모의 데이터'));
    var ms = D.stock ? S.stockModels(D.stock, fam, '') : [];
    if (ms.length) { ms.slice(0, 8).forEach(function (m) { c2.appendChild(S.modelCard(m, ms.length === 1)); }); c2.appendChild(S.a('stock.html?car=' + encodeURIComponent(fam), 'more', '이 차종 재고 자세히 →')); }
    else c2.appendChild(el('div', 'empty', D.stock ? '지금은 바로 출고 가능한 차가 없습니다 — 입고 예정은 상담으로 알려 드립니다.' : '재고 공개를 준비 중입니다 — 지금 있는 색은 상담으로 바로 확인해 드립니다.'));
    body.appendChild(c2);
    // ③ 블로그 글
    var c3 = card('이 차종 글 · 색상 360도'); var ps = []; if (D.posts) S.famPosts(D.posts, fam).forEach(function (c) { ps = ps.concat(c.글 || []); });
    if (ps.length) ps.slice(0, 5).forEach(function (p) { c3.appendChild(S.postCard(p)); }); else c3.appendChild(el('div', 'empty', '아직 이 차종 글이 없습니다 — 궁금한 점은 상담으로.'));
    body.appendChild(c3);
    // ④ 영상
    var vs = D.videos && D.videos.목록 ? D.videos.목록.filter(function (v) { return S.norm(v.제목).indexOf(S.famKey(fam)) >= 0; }) : [];
    if (vs.length) { var c4 = card('영상'); vs.slice(0, 3).forEach(function (v) { c4.appendChild(S.postCard(v, 'video')); }); body.appendChild(c4); }
    // ⑤ 상담
    var c5 = card('이 차종으로 상담'); var big = el('div', 'big'); big.appendChild(S.a(S.kakao, 'p', '카톡으로 상담', 'kakao')); big.appendChild(S.a(S.sms('상담 신청: ' + fam + ' · 원하는 색 · 희망 시기를 남겨 주세요.'), '', '문자로 남기기 (' + fam + ')', 'sms')); c5.appendChild(big); body.appendChild(c5);
    window.scrollTo({ top: 0 });
  }
  function chips() {
    var fams = {}; if (D.prices) D.prices.목록.forEach(function (r) { fams[r.계열] = (fams[r.계열] || 0) + 1; }); var sf = S.fams(D.stock); Object.keys(sf).forEach(function (k) { fams[k] = (fams[k] || 0) + sf[k] * 3; });
    var order = Object.keys(fams).sort(function (a, b) { return fams[b] - fams[a]; }); if (!fams[fam]) fam = order[0] || '';
    S.chipBar($('famChips'), order.map(function (k) { return [k, k]; }), function () { return fam; }, function (v) { fam = v; }, render, false);
  }
  Promise.all(['prices', 'promo', 'stock', 'posts', 'videos'].map(function (k) { return S.getJSON(k + '.json').then(function (d) { D[k] = d; }).catch(function () {}); })).then(function () { chips(); render(); });
})();
</script>
</body>
</html>
